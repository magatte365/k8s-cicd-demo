apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskmanager-backend
spec:
  template:
    spec:
      containers:
      - name: backend
        env:
        - name: MONGODB_URI
          value: "mongodb://dev-mongodb-service:27017/taskmanager"
        - name: MONGO_URL
          value: "mongodb://dev-mongodb-service:27017/taskmanager"
        - name: DATABASE_URL
          value: "mongodb://dev-mongodb-service:27017/taskmanager"
        - name: DB_URI
          value: "mongodb://dev-mongodb-service:27017/taskmanager"
