apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskmanager-frontend-prod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/magatte365/k8s-cicd-demo.git
    targetRevision: main
    path: frontend/k8s/overlays/prod

  destination:
    server: https://10.43.93.119:443  # my-vcluster
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
